version: "3"

vars:
  DOCS_DIR: showcase

tasks:
  # === セットアップ ===
  setup:
    desc: 依存関係をインストール
    cmds:
      - bun install
      - cd {{.DOCS_DIR}} && bun install

  # === ライブラリ ===
  generate:
    desc: アイコンコードを自動生成
    cmd: node scripts/migrate.mjs

  build:
    desc: ライブラリをビルド
    cmd: bun run build

  lint:
    desc: ライブラリをlint
    cmd: bun run lint

  format:
    desc: コードをフォーマット
    cmd: bun run format

  # === Showcase ===
  showcase:dev:
    desc: Showcaseサイトの開発サーバーを起動
    dir: "{{.DOCS_DIR}}"
    cmd: bun run dev

  showcase:build:
    desc: Showcaseサイトをビルド
    dir: "{{.DOCS_DIR}}"
    cmd: bun run build

  showcase:preview:
    desc: Showcaseサイトをプレビュー
    dir: "{{.DOCS_DIR}}"
    cmd: bun run preview

  showcase:lint:
    desc: Showcaseサイトをlint
    dir: "{{.DOCS_DIR}}"
    cmd: bun run lint

  showcase:typecheck:
    desc: Showcaseサイトの型チェック
    dir: "{{.DOCS_DIR}}"
    cmd: bun run typecheck

  # === パブリッシュ ===
  publish:
    desc: npmにパブリッシュ
    cmds:
      - echo "Publishing lolicon v$(node -p \"require('./package.json').version\")"
      - bun run build
      - npm publish

  # === 横断 ===
  lint:all:
    desc: 全プロジェクトをlint
    deps: [lint, showcase:lint]

  check:
    desc: lint + 型チェックを一括実行
    deps: [lint:all, showcase:typecheck]
